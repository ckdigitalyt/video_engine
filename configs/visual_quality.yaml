# visual_quality.yaml — Visual Quality Configuration (V1+)
#
# Semantic validation is now authoritative (threshold >= 0.75).
# The Visual Director handles retry/regeneration when gates fail.

semantic_validation:
  enabled: true
  # HARD quality gate — assets below this score are REJECTED
  threshold: 0.75
  # Maximum retries across all queries for a single scene
  max_attempts: 5

# ── Video Duration Verification ──────────────────────────────────────────

duration_verification:
  enabled: true
  max_speed_change: 1.5
  prefer_loop: true

# ── Clip Diversity ─────────────────────────────────────────────────────────

clip_diversity:
  enabled: true
  recent_window: 5
  repeat_penalty: 0.3
  query_repeat_penalty: 0.15

# ── Smart Transitions ──────────────────────────────────────────────────────

smart_transitions:
  enabled: true
  same_topic_default: "cut"
  same_provider_default: "dissolve"
  new_idea_default: "fade"
