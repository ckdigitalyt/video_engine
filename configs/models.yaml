# models.yaml — LLM model definitions for the video_engine pipeline
# Each provider key maps to its model identifier and generation parameters.
#
# Provider selection flows:
#   1. Explicit argument to constructor (highest priority)
#   2. pipeline.roles.{role} in pipeline.yaml (e.g. planner, critic)
#   3. pipeline.roles.default in pipeline.yaml (default: gemini flash)
#   4. Runtime fallback chains (v12.6): mistral free -> zai glm-5.3-flash
#
# No module should hardcode ZaiProvider() or GeminiProvider().
# Always use ProviderFactory or pass an LLMProvider instance.

llm:
  zai:
    model: "glm-5.3-flash"
    script_model: "glm-5.3-flash"
    max_tokens: 8192
    temperature: 0.7

  gemini:
    model: "models/gemini-2.5-flash"
    script_model: "models/gemini-2.5-flash"

  # v37 (ckdigital 2026-08-13): gemini-3.7-flash verified live (model listed +
  # completion OK, intermittent 503 high-demand).  Used as pipeline PRIMARY so
  # the paid chain only runs when the free chain (3.7 -> 2.5 -> groq/openrouter)
  # all fail. (2026-08-30: paid DeepSeek retired; ZAI glm-5.3-flash replaced it.)
  gemini37:
    model: "models/gemini-3.7-flash"
    script_model: "models/gemini-3.7-flash"
    max_tokens: 2000
    temperature: 0.7

  mistral:
    model: "mistral-small-latest"
    script_model: "mistral-small-latest"
    max_tokens: 2000
    temperature: 0.7

  grok:
    model: "grok-3"
    script_model: "grok-3"
    max_tokens: 2000
    temperature: 0.7

  groq:
    model: "llama-3.3-70b-versatile"
    script_model: "llama-3.3-70b-versatile"
    max_tokens: 2000
    temperature: 0.7

  nemotron:
    model: "nvidia/nemotron-3-super-120b-a12b"
    script_model: "nvidia/nemotron-3-super-120b-a12b"
    max_tokens: 16000
    timeout: 600
    temperature: 0.7

  openrouter:
    model: "google/gemma-4-26b-a4b-it:free"
    script_model: "google/gemma-4-26b-a4b-it:free"
    max_tokens: 2000
    temperature: 0.7

# ai_video — model registry for the AI-video broker path (directive §8-§10).
# Informational registry: the broker picks providers by kind + failover order
# (configs/providers.yaml + PROVIDER_FACTORIES); this table names the model
# behind each provider id so render records can carry a stable model label.
ai_video:
  text_to_video:
    hf_router_t2v:
      model: "Wan2.2-T2V-A14B"
      host: "hf_router (fal-ai)"
      billing: "monthly included credits"
      enabled_by: "HF_TOKEN"
    minimax_h3:
      model: "MiniMax-H3"
      host: "api.minimax.io"
      billing: "paid per-second, no free tier"
      enabled: false          # needs MINIMAX_API_KEY + §26 spend approval
    zerogpu_t2v:
      model: "LTX-Video-Distilled / LTX-2-Distilled"
      host: "hf ZeroGPU Spaces"
      billing: "daily GPU-min quota (~5 min/day free tier)"
  image_to_video:
    hf_router_i2v:
      model: "Wan2.2-I2V-A14B"
      host: "hf_router (fal-ai)"
      billing: "monthly included credits"
      enabled_by: "HF_TOKEN"
    wan22_i2v:
      model: "Wan2.2-I2V-A14B-Lightning"
      host: "hf ZeroGPU Space (Saravutw)"
      billing: "daily GPU-min quota"
    ltx_video:
      model: "LTX-Video-Distilled"
      host: "hf ZeroGPU Space (Lightricks)"
      billing: "daily GPU-min quota"
    zerogpu_i2v:
      model: "multi-Space scheduler pool"
      host: "hf ZeroGPU Spaces"
      billing: "daily GPU-min quota, account-wide ledger"
