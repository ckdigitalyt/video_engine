# pipeline.yaml — Orchestration and pipeline behaviour settings

pipeline:
  # Maximum number of planner/review iterations before forced approval.
  # v12.5 cost guardrail: 1 by default; a 2nd pass runs only when the review
  # score is below improve_score_threshold (see mission_run/mission_stills).
  max_iterations: 1

  # v12.5: render improvement passes — hard stop at 1 rerender. A 2nd render
  # pass is allowed ONLY when the latest review score is below this threshold.
  improve_score_threshold: 70

  # Script review personas: 2 by default (fact + storytelling). Set to
  # ["fact_reviewer","documentary_editor","retention_reviewer","storytelling_reviewer"]
  # or "all" to run the full 4-persona suite (2x the LLM calls per pass).
  script_review:
    personas: ["fact_reviewer", "storytelling_reviewer"]
    max_passes: 2

  # Local cache directories for intermediate assets
  cache:
    video: "cache/video"
    audio: "cache/audio"
    music: "cache/music"

  # v13 rec #3 (expert review): source images must have headroom for
  # Ken Burns pan/zoom.  Never generate at final-output resolution and
  # then zoom — the quality gate derives the SAFE zoom from the actual
  # source dimensions (see src/qa/resolution_gate.py).
  image_gen:
    # Requested generation size (Pollinations honors it; NIM snaps to
    # its allowed dims, max 2048).  2560x1440 = 1.33x headroom over
    # 1920x1080 output; enough for the default 1.0-1.22 Ken Burns zoom.
    stills_width: 2560
    stills_height: 1440
    # Internal Ken Burns render scale (2x output) before downscale.
    kenburns_internal_scale: 2.0
    # Fail pre-render if a still shot's zoom exceeds headroom by more
    # than this margin (a 1.05x margin keeps rounding noise away).
    zoom_headroom_margin: 1.05

  # Fallback is handled by FallbackDirector — no static clip
  fallback:
    video: ""  # Empty: FallbackDirector handles all degradation

  # Default output video file
  output:
    default: "final_output.mp4"

  # Managed SQLite asset cache
  cache_db: "cache/asset_cache.db"
  cache_max_size_mb: 500

  # Structured memory layer
  memory:
    db_path: "cache/memory.db"
    retention_days: 90
    max_execution_logs: 1000
    cleanup_interval_runs: 10

  # Critic evaluation settings
  critic:
    # FFmpeg seek timestamp for frame extraction
    frame_extraction_ss: "00:00:02"
    # Path for the extracted evaluation frame
    eval_frame: "cache/video/eval_frame.jpg"

  roles:
    # v13.1: text stages on Mistral free tier (Gemini 2.5-flash free quota is
    # only 20 req/day and burns out mid-run); Gemini stays for vision-only.
    # v19 (ckdigital direction): default is GEMINI — the runner wraps every
    # provider in a cost chain (primary -> gemini/grok/mistral -> deepseek
    # LAST), falling through per-call on quota/errors.  So Gemini/Grok are
    # leveraged first and DeepSeek cost stays minimal; the old "Gemini 429
    # kills the run" failure mode is gone because ChainLLMProvider retries
    # the next provider in the chain on each call.
    default: "gemini"
    # Fallback provider when the default is unavailable (deepseek last resort)
    fallback: "deepseek"
    # Cost-chain preference order (primary is always tried first)
    chain: ["gemini", "grok", "mistral"]
    # Role-specific provider overrides
    planner: "mistral"
    critic: "gemini"
