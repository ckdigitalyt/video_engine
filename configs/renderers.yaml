# Renderer capability registry (v3 Wave 1) — consumed by engine/renderers/registry.py
# Each record conforms to schemas/renderer_capability_v1.schema.json.
# quality_dimensions: self-rated capability per router dimension in [0,1].
# enabled: whether the registry instantiates it (stubs count as enabled-but-not-implemented).

AI_VIDEO:
  display_name: "AI-generated video"
  strengths: [cinematic realism, complex physical motion, hero moments, atmospheric lighting]
  input_kinds: [text_prompt, image]
  output: video
  cost_tier: HERO
  availability: {enabled: true, offline_capable: false, requires_network: true, requires_remote_gpu: true}
  quality_dimensions:
    realism: 1.0
    physical_motion: 1.0
    math_precision: 0.05
    character_interaction: 0.8
    emotional_impact: 0.95
    historical_authenticity: 0.7
    diagrammatic: 0.1
    camera_movement: 0.9
    text_heavy: 0.05
    stylization: 0.8
    cinematic_value: 1.0
    visual_event_density: 1.0
  max_duration_sec: 10
  notes: "Hero shots only (§2C). Providers: MiniMax H3, Wan 2.2, LTX (Wave 2)."

AI_IMAGE_MOTION:
  display_name: "AI still + procedural motion"
  strengths: [photoreal stills, Ken Burns, parallax, atmosphere, cost-efficient impact]
  input_kinds: [text_prompt]
  output: video
  cost_tier: MEDIUM
  availability: {enabled: true, offline_capable: false, requires_network: true, requires_remote_gpu: true}
  quality_dimensions:
    realism: 0.85
    physical_motion: 0.4
    math_precision: 0.05
    character_interaction: 0.5
    emotional_impact: 0.8
    historical_authenticity: 0.75
    diagrammatic: 0.2
    camera_movement: 0.5
    text_heavy: 0.3
    stylization: 0.85
    cinematic_value: 0.7
    visual_event_density: 0.45
  max_duration_sec: 12
  notes: "AI_IMAGE path (§12): image gen + procedural camera/parallax/particles."

STOCK_VIDEO:
