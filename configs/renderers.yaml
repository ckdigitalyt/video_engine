# Canonical offline degradation chain (§24): AI_VIDEO → AI_IMAGE+MOTION →
# STOCK_VIDEO → MOTION_CANVAS → PIXIJS → MANIM. ARCHIVAL is not part of the
# canonical chain — the router splices it in for historical shots.
fallback_chain:
  - AI_VIDEO
  - AI_IMAGE_MOTION
  - STOCK_VIDEO
  - MOTION_CANVAS
  - PIXIJS
  - MANIM
