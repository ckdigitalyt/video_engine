  quality_dimensions:
    realism: 1.0
    physical_motion: 0.8
    math_precision: 0.0
    character_interaction: 0.6
    emotional_impact: 0.7
    historical_authenticity: 0.6
    diagrammatic: 0.05
    camera_movement: 0.3
    text_heavy: 0.0
    stylization: 0.2
    cinematic_value: 0.7
    visual_event_density: 0.8
  max_duration_sec: 20
  notes: "Pexels/Pixabay via AI Media Broker; license metadata mandatory (§13)."

