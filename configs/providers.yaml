# providers.yaml — External API provider configuration

providers:
  deepseek:
    # DeepSeek API base URL
    base_url: "https://api.deepseek.com"

  pexels:
    # Pexels video search API endpoint
    base_url: "https://api.pexels.com/videos/search"
    # Results per page (asset scoring evaluates up to this many candidates)
    per_page: 10
    # Weighting for deterministic asset quality scoring
    scoring:
      resolution_weight: 0.40
      duration_match_weight: 0.40
      hd_bonus_weight: 0.20
    # Orientation filter for video search
    orientation: "landscape"

    # Reusable asset library (local-first lookup)
    reuse:
      enabled: true
      similarity_threshold: 0.45
      max_candidates: 5

  pixabay:
    # Pixabay video search API endpoint
    base_url: "https://pixabay.com/api/videos"
    # Results per page
    per_page: 10
    # Orientation filter: "horizontal", "vertical", or "all"
    orientation: "horizontal"
    # Minimum video width (px) — filters out low-res content
    min_width: 1920
    # Safe search: "true" or "false"
    safesearch: "true"
    # Scoring uses the same weights as pexels (shared via PexelsProvider._score_candidates)

# ── Topic-aware asset routing ──────────────────────────────────────────────
# The AssetRouter uses this table to determine which provider(s) to try for
# a given topic category.  Providers are tried in order; the first non-empty
# result wins.
#
# To add a new provider:
# 1. Implement the AssetProvider interface.
# 2. Add the provider name to the appropriate category routes below.
# 3. Instantiate it in AssetRouter._default_providers().
#
# Category keywords are used by the TopicClassifier to map a video topic
# string (e.g. "The Fermi Paradox") to a category name.

asset_routing:
  # Provider priority per category (first provider with results wins)
  routes:
    Space:      [nasa, pixabay, pexels]
    History:    [wikimedia, pixabay, pexels]
    Science:    [nasa, pixabay, pexels]
    Nature:     [pixabay, pexels]
    Technology: [pixabay, pexels]
    Finance:    [pixabay, pexels]
    General:    [pixabay, pexels]

  # Category keyword definitions for the TopicClassifier
