# voices.yaml — TTS and audio mixing settings

voices:
  # v13 consolidation: SINGLE source of truth for the narrator engine.
  # Both runners (mission_run.py / mission_stills.py) read
  # voices.provider — no hardcoded per-runner engines, so the pipeline
  # can never diverge again.
  # 2026-08-09 (ckdigital): FISH AUDIO S2.1 Pro Free is the narrator.
  # Model s2.1-pro-free, voice "Narrator" by Max N (deep, warm,
  # authoritative, standard American English).  ONE voice per video —
  # never switched mid-video (voice lock records every scene; switching
  # fails QA).  Chatterbox is the fallback if the Fish API fails.
  provider: "fish"

  fish:
    # PRIMARY NARRATOR — 2026-08-09 (ckdigital direction).
    # Model: s2.1-pro (BEST tier — ckdigital confirmed commercial terms are
    # fine 2026-08-09; paid tier approved, never downgrade to free).  Sent
    # as an HTTP HEADER (a missing/misspelled header silently bills the
    # paid tier — the provider validates the configured model name).
    # Voice: "Narrator" by Max N (reference_id verified via live API;
    # tags: deep/authoritative/calm/measured/documentary).
    model: "s2.1-pro"
    allow_paid: true
    voice_id: "0327fdb5da9e4fd782899a8058c8ae2b"
    # Restrained documentary delivery (channel direction): the voice is
    # naturally calm/measured; style cues ([calm]/[measured]) are injected
    # sparingly at sentence starts — emphasis/suspense/wonder only, never
    # over-dramatized.
    temperature: 0.6
    top_p: 0.9
    sample_rate: 44100
    format: "mp3"
    mp3_bitrate: 320
    condition_on_previous_chunks: true
    prosody:
      speed: 0.95    # 0.95-1.05 band — 52-Hz run hit 200/220wpm on short scenes; 0.95 for headroom
      volume: 0
      normalize_loudness: true

  chatterbox:
    # FALLBACK narrator (ckdigital 2026-08-09): used when the Fish API
    # fails.  Kurzgesagt-style clone (previously the primary 2026-08-05).
    voice_id: "kurzgesagt_like"
    audio_prompt: "cache/voices/ref_thomas.wav"
    cfg_weight: 0.32
    exaggeration: 0.50
    style: documentary
    pacing: slightly_slow
    tone: warm_energetic

  elevenlabs:
    # ROLLBACK narrator (2026-08-09 experiment — Declan Sage is a library
    # voice needing a paid plan; own-voice fallback George works on free).
    # Superseded by Fish Audio same day.
    voice: "Declan Sage"
    fallback_voice: "David"
    own_voice_fallback: "George - Warm, Captivating Storyteller"
    model: "eleven_multilingual_v2"
    stability: 0.55
    similarity_boost: 0.85
    style: 0.30

  kokoro:
    # Kokoro ONNX model file
    model: "kokoro-v0_19.onnx"
    # Kokoro voices binary
    voices_bin: "voices.bin"
    # Default voice identifier
    default_voice: "bm_george"
    # Speech speed multiplier (1.0 = normal)
    speed: 1.0
    # Language / accent tag
    language: "en-gb"

  mixing:
    # Decibel reduction for background music ducking
    ducking_db: -12
    # Tail silence (ms) appended after voice clip
    tail_ms: 2000
    # Fade-in duration for background music (ms)
    fade_in_ms: 3000
    # Fade-out duration for background music (ms)
    fade_out_ms: 3000
    # Additional gain applied to music before ducking (dB)
    music_volume_db: -14.0   # v19g: bed 14 dB under voice (old 0.0 = full-volume bed drowning narration)
    # Default background music file
    background_music: "cache/music/cinematic.mp3"
