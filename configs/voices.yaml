# voices.yaml — TTS (Kokoro) and audio mixing settings

voices:
  chatterbox:
    # PRIMARY NARRATOR — LOCKED 2026-08-05 (ckdigital approved
    # variant_kurzgesagt_like.wav as the channel narrator).
    # Warm, friendly, energetic British-style documentary narrator,
    # cloned from a SYNTHETIC reference (edge-tts en-GB-ThomasNeural,
    # 26.6s clean speech — NOT a real person, no likeness issues).
    # Reference language (en-GB) matches target (English) — no accent
    # transfer (Chatterbox docs).
    voice_id: "kurzgesagt_like"
    audio_prompt: "cache/voices/ref_thomas.wav"
    # Approved variant params (ex=0.50, cfg=0.32): energetic-but-clear.
    cfg_weight: 0.32
    exaggeration: 0.50
    style: documentary
    pacing: slightly_slow
    tone: warm_energetic

  kokoro:
    # Kokoro ONNX model file
    model: "kokoro-v0_19.onnx"
    # Kokoro voices binary
    voices_bin: "voices.bin"
    # Default voice identifier
    default_voice: "bm_george"
    # Speech speed multiplier (1.0 = normal)
    speed: 1.0
    # Language / accent tag
    language: "en-gb"

  mixing:
    # Decibel reduction for background music ducking
    ducking_db: -12
    # Tail silence (ms) appended after voice clip
    tail_ms: 2000
    # Fade-in duration for background music (ms)
    fade_in_ms: 3000
    # Fade-out duration for background music (ms)
    fade_out_ms: 3000
    # Additional gain applied to music before ducking (dB)
    music_volume_db: 0.0
    # Default background music file
    background_music: "cache/music/cinematic.mp3"
