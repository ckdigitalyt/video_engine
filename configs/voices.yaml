# voices.yaml — TTS (Kokoro) and audio mixing settings

voices:
  chatterbox:
    # PRIMARY NARRATOR — English documentary, US/global audience.
    # Channel direction 2026-08-05: warm, authoritative, clear, mature;
    # General American documentary tone; NOT theatrical/gravelly.
    # No celebrity cloning; audio_prompt stays empty (built-in voice).
    # If a reference clip is added later: clean speech only, language
    # must match the target (avoid accent transfer).
    audio_prompt: ""
    # Calmer documentary band (docs: defaults 0.5/0.5; reduce cfg for
    # pacing, keep exaggeration moderate):
    cfg_weight: 0.35
    exaggeration: 0.40
    style: documentary
    pacing: slightly_slow
    tone: warm_authoritative

  kokoro:
    # Kokoro ONNX model file
    model: "kokoro-v0_19.onnx"
    # Kokoro voices binary
    voices_bin: "voices.bin"
    # Default voice identifier
    default_voice: "bm_george"
    # Speech speed multiplier (1.0 = normal)
    speed: 1.0
    # Language / accent tag
    language: "en-gb"

  mixing:
    # Decibel reduction for background music ducking
    ducking_db: -12
    # Tail silence (ms) appended after voice clip
    tail_ms: 2000
    # Fade-in duration for background music (ms)
    fade_in_ms: 3000
    # Fade-out duration for background music (ms)
    fade_out_ms: 3000
    # Additional gain applied to music before ducking (dB)
    music_volume_db: 0.0
    # Default background music file
    background_music: "cache/music/cinematic.mp3"
