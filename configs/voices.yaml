# voices.yaml — TTS and audio mixing settings

voices:
  # v13 consolidation: SINGLE source of truth for the narrator engine.
  # Both runners (mission_run.py / mission_stills.py) read
  # voices.provider — no hardcoded per-runner engines, so the pipeline
  # can never diverge again (was: mission_run -> kokoro, stills ->
  # chatterbox).
  # 2026-08-09 (ckdigital): ELEVENLABS is the narrator.  Declan Sage
  # default (global English/US, warm authority, clear pacing), David
  # fallback.  ONE voice per video — resolved once, never switched
  # mid-video (voice lock records every scene; switching fails QA).
  provider: "elevenlabs"

  elevenlabs:
    # PRIMARY NARRATOR — 2026-08-09 (ckdigital direction).
    # Declan Sage: warm authority, natural pronunciation, tuned for a
    # global English/US audience.  David is the fallback if Declan is
    # unavailable (e.g. not in the account/library).  Voice IDs are
    # resolved BY NAME from the API at run start and cached in
    # cache/voices/elevenlabs_voices.json.
    voice: "Declan Sage"
    fallback_voice: "David"
    # Free plans cannot use shared-LIBRARY voices (Declan Sage, David)
    # via the API — lookups work but synthesis returns 402
    # paid_plan_required.  When the primary+fallback can't synthesize,
    # use this OWN voice (free-plan usable) — George is the closest
    # match to Declan's male warm-authority direction.  Empty = auto-pick
    # the best-scoring own voice that actually synthesizes.
    own_voice_fallback: "George - Warm, Captivating Storyteller"
    model: "eleven_multilingual_v2"
    # High stability = consistent, measured delivery (un-rushed);
    # similarity_boost keeps the narrator's timbre tight across scenes;
    # style adds a hint of documentary warmth without theatrics.
    stability: 0.55
    similarity_boost: 0.85
    style: 0.30

  chatterbox:
    # PREVIOUS narrator (locked 2026-08-05, superseded 2026-08-09 by
    # ElevenLabs Declan Sage).  Kept for rollback.
    voice_id: "kurzgesagt_like"
    audio_prompt: "cache/voices/ref_thomas.wav"
    cfg_weight: 0.32
    exaggeration: 0.50
    style: documentary
    pacing: slightly_slow
    tone: warm_energetic

  kokoro:
    # Kokoro ONNX model file
    model: "kokoro-v0_19.onnx"
    # Kokoro voices binary
    voices_bin: "voices.bin"
    # Default voice identifier
    default_voice: "bm_george"
    # Speech speed multiplier (1.0 = normal)
    speed: 1.0
    # Language / accent tag
    language: "en-gb"

  mixing:
    # Decibel reduction for background music ducking
    ducking_db: -12
    # Tail silence (ms) appended after voice clip
    tail_ms: 2000
    # Fade-in duration for background music (ms)
    fade_in_ms: 3000
    # Fade-out duration for background music (ms)
    fade_out_ms: 3000
    # Additional gain applied to music before ducking (dB)
    music_volume_db: 0.0
    # Default background music file
    background_music: "cache/music/cinematic.mp3"
