# Python CI — video_engine test suite

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          # Provide dummy API keys so provider imports do not fail.
          # Real keys are never used — all external APIs are mocked in tests.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'ci-dummy-key' }}
        run: |
          source venv/bin/activate
          pytest

      - name: Upload coverage report
        if: always()
        run: |
          source venv/bin/activate
          pytest --cov=src --cov=renderer --cov-report=term-missing
