# Phase 0: Visual Knowledge Library — YAML entry for Fermi Paradox
concept: "Fermi Paradox"
aliases: ["Great Silence", "Where is everybody?", "Fermi's Question", "Fermi Paradox Explained"]
documentary_explanation: >
  The Fermi Paradox is the contradiction between the high probability of
  extraterrestrial life (given the age and scale of the universe) and
  humanity's lack of contact with or evidence for such civilizations.
  Named after physicist Enrico Fermi who famously asked "Where is everybody?"
  over lunch at Los Alamos in 1950.
