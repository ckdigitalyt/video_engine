# Visual Knowledge Library — Quantum Mechanics
concept: "Quantum Mechanics"
aliases: ["quantum physics", "quantum theory", "wave-particle duality", "superposition", "quantum entanglement", "Schrödinger equation"]
documentary_explanation: >
  Quantum mechanics is the fundamental theory describing nature at the smallest
  scales of energy levels of subatomic particles.  It introduces concepts like
  wave-particle duality (particles behave as both particles and waves),
  quantization of energy levels, superposition (a particle exists in multiple
  states until measured), and entanglement (particles remain correlated even
  across vast distances).  It is the most precisely tested theory in science.
