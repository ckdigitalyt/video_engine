# Visual Knowledge Library — CMB (Cosmic Microwave Background)
concept: "Cosmic Microwave Background"
aliases: ["CMB", "cosmic background radiation", "WMAP", "Planck satellite", "relic radiation", "first light"]
documentary_explanation: >
  The Cosmic Microwave Background is the thermal radiation left over from the
  Big Bang, filling all of space.  It was emitted about 380,000 years after
  the Big Bang when the universe cooled enough for electrons and protons to
  form neutral hydrogen (recombination), allowing photons to travel freely.
  Its near-perfect blackbody spectrum at 2.725 K and tiny temperature
  fluctuations (parts in 100,000) provide a snapshot of the early universe
  and encode its composition, geometry, and evolution.
