# Visual Knowledge Library — Redshift
concept: "Redshift"
aliases: ["cosmological redshift", "Doppler shift", "light stretching", "wavelength elongation", "Hubble redshift"]
documentary_explanation: >
  Redshift is the phenomenon where light from distant objects is shifted
  toward longer (redder) wavelengths as the universe expands.  It is a
  direct consequence of the expansion of space itself — not just relative
  motion — and is the key evidence for the Big Bang and ongoing cosmic
  expansion.  Higher redshift means greater distance and earlier cosmic epoch.
