# Visual Knowledge Library — Supply and Demand
concept: "Supply and Demand"
aliases: ["supply curve", "demand curve", "market equilibrium", "price mechanism", "law of supply and demand"]
documentary_explanation: >
  Supply and demand is the fundamental model of price determination in market
  economies.  The law of demand states that as price increases, quantity
  demanded decreases (all else equal).  The law of supply states that as
  price increases, quantity supplied increases.  Market equilibrium occurs
  where the two curves intersect.  Shifts in either curve (due to changes in
  preferences, technology, costs, etc.) cause new equilibrium prices and
  quantities.
