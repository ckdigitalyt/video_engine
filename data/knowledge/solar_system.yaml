# Visual Knowledge Library — Solar System
concept: "Solar System"
aliases: ["our solar system", "planets", "inner planets", "outer planets", "Kuiper belt", "Oort cloud", "planetary system"]
documentary_explanation: >
  Our solar system consists of the Sun and everything bound to it by gravity:
  eight planets, five dwarf planets, hundreds of moons, millions of asteroids,
  comets, and the distant Kuiper Belt and Oort Cloud.  The inner rocky planets
  (Mercury, Venus, Earth, Mars) contrast with the outer gas and ice giants
  (Jupiter, Saturn, Uranus, Neptune).  The solar system formed 4.6 billion
  years ago from a collapsing molecular cloud.
