# Visual Knowledge Library — Probability
concept: "Probability"
aliases: ["probability theory", "Bayesian probability", "statistical inference", "conditional probability", "normal distribution", "central limit theorem"]
documentary_explanation: >
  Probability theory is the mathematical framework for quantifying
  uncertainty.  Originating from gambling problems studied by Pascal and
  Fermat in the 17th century, it now underpins statistics, quantum mechanics,
  machine learning, insurance, epidemiology, and decision theory.  Key
  concepts include conditional probability (P(A|B) = P(A∩B)/P(B)), Bayes'
  theorem, probability distributions (normal, binomial, Poisson), and the
  law of large numbers.
