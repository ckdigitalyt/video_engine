# Visual Knowledge Library — Nuclear Fusion
concept: "Nuclear Fusion"
aliases: ["fusion", "stellar fusion", "proton-proton chain", "fusion reactor", "stellar nucleosynthesis"]
documentary_explanation: >
  Nuclear fusion is the process where light atomic nuclei combine to form
  heavier nuclei, releasing enormous amounts of energy.  It powers stars,
  including our Sun, through the proton-proton chain and CNO cycle.  On Earth,
  scientists are working to harness fusion for clean energy using tokamaks
  (like ITER) and stellarators.  Fusion requires extreme temperatures and
  pressures to overcome electrostatic repulsion.
