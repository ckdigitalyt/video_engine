# Visual Knowledge Library — Roman Empire
concept: "Roman Empire"
aliases: ["ancient Rome", "Roman civilization", "Roman Republic", "Julius Caesar", "Roman Empire rise", "SPQR"]
documentary_explanation: >
  The Roman Empire was the post-Republican period of ancient Rome, spanning
  from 27 BCE when Augustus became the first emperor, to the fall of the
  Western Roman Empire in 476 CE.  At its height, it controlled territory
  from Britain to North Africa to Mesopotamia.  Roman contributions include
  republican government, codified law (Roman law, Justinian Code), engineering
  (aqueducts, roads, concrete), the Latin language, and the spread of
  Christianity.
