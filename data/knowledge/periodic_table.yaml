# Visual Knowledge Library — Periodic Table
concept: "Periodic Table"
aliases: ["elements", "periodic table of elements", "Mendeleev table", "chemical elements", "atomic numbers"]
documentary_explanation: >
  The periodic table is a tabular arrangement of chemical elements, organized
  by atomic number (number of protons), electron configuration, and recurring
  chemical properties.  First developed by Dmitri Mendeleev in 1869, who left
  gaps for undiscovered elements, the table now contains 118 confirmed
  elements.  Periods (rows) correspond to electron shells, while groups
  (columns) contain elements with similar valence electron configurations and
  chemical behavior.
