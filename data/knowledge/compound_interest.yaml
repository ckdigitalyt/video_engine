# Visual Knowledge Library — Compound Interest
concept: "Compound Interest"
aliases: ["compounding", "exponential growth", "interest on interest", "the eighth wonder", "Einstein compounding"]
documentary_explanation: >
  Compound interest is the process where interest earned on an investment is
  reinvested to generate additional interest, leading to exponential growth.
  The formula is A = P(1 + r/n)^(nt), where P is principal, r the annual
  rate, n compounding periods per year, and t years.  Over long time horizons,
  compounding produces dramatically larger returns than simple interest.
  It applies to investments, loans, credit cards, and population growth.
