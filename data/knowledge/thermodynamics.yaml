# Visual Knowledge Library — Thermodynamics
concept: "Thermodynamics"
aliases: ["laws of thermodynamics", "heat transfer", "entropy", "second law", "thermal physics"]
documentary_explanation: >
  Thermodynamics is the branch of physics that deals with heat, work,
  temperature, and energy in physical systems.  The four laws govern all
  energy transformations: Zeroth (thermal equilibrium), First (energy
  conservation: ΔU = Q - W), Second (entropy always increases in isolated
  systems), and Third (absolute zero is unattainable).  The concept of
  entropy, a measure of disorder, has profound implications in physics,
  information theory, and cosmology.
