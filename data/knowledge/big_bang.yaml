# Visual Knowledge Library — Big Bang
concept: "Big Bang"
aliases: ["cosmic origin", "universe began", "initial singularity", "cosmic inflation", "early universe"]
documentary_explanation: >
  The Big Bang is the scientific theory describing the observable universe's
  origin from an extremely hot, dense state approximately 13.8 billion years
  ago.  The universe has been expanding and cooling ever since.  Evidence
  includes the cosmic microwave background radiation, Hubble's law of galaxy
  redshifts, and the abundance of light elements (primordial nucleosynthesis).
