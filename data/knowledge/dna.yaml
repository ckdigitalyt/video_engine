# Visual Knowledge Library — DNA
concept: "DNA"
aliases: ["deoxyribonucleic acid", "genetic code", "double helix", "chromosome", "genome"]
documentary_explanation: >
  DNA (deoxyribonucleic acid) is the molecule that carries the genetic
  instructions for all known living organisms.  Its double-helix structure,
  discovered by Watson and Crick in 1953 (based on X-ray crystallography by
  Rosalind Franklin), consists of two strands of nucleotides coiled around
  each other.  The sequence of four bases—adenine (A), thymine (T), cytosine
  (C), and guanine (G)—encodes the information for building proteins.
