# Visual Knowledge Library — Photosynthesis
concept: "Photosynthesis"
aliases: ["light reactions", "Calvin cycle", "chlorophyll", "carbon fixation", "oxygen evolution"]
documentary_explanation: >
  Photosynthesis is the process by which plants, algae, and cyanobacteria
  convert light energy from the sun into chemical energy.  It occurs in the
  chloroplasts, where chlorophyll captures photons to produce ATP and NADPH
  (light-dependent reactions), which then power the Calvin cycle to fix
  carbon dioxide into glucose.  The overall equation: 6CO₂ + 6H₂O + light
  → C₆H₁₂O₆ + 6O₂.  It is the primary source of organic matter and oxygen
  on Earth.
