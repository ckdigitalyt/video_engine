# Visual Knowledge Library — Electromagnetism
concept: "Electromagnetism"
aliases: ["electromagnetic force", "Maxwell's equations", "light as EM wave", "electromagnetic spectrum", "EM field"]
documentary_explanation: >
  Electromagnetism is one of the four fundamental forces of nature.  It
  governs the interactions between electrically charged particles and is
  described by Maxwell's equations (1864), which unified electricity and
  magnetism into a single framework.  Light is an electromagnetic wave.
  The electromagnetic spectrum spans radio waves, microwaves, infrared,
  visible light, ultraviolet, X-rays, and gamma rays — all differing only
  in wavelength and frequency.
