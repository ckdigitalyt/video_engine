# Visual Knowledge Library — Exoplanets
concept: "Exoplanets"
aliases: ["extrasolar planets", "alien worlds", "exoplanet discovery", "exoplanet atmospheres", "habitable zone"]
documentary_explanation: >
  Exoplanets are planets that orbit stars outside our solar system.  Since
  the first confirmed detection in 1995, thousands have been discovered
  using methods like transit photometry (Kepler, TESS), radial velocity
  (Doppler spectroscopy), and direct imaging.  Some exoplanets orbit within
  their star's habitable zone, where liquid water could exist.
