# Visual Knowledge Library — Neural Networks
concept: "Neural Networks"
aliases: ["artificial neural networks", "deep learning", "machine learning", "AI neural networks", "perceptron", "backpropagation"]
documentary_explanation: >
  Artificial neural networks are computing systems inspired by biological
  neural networks in the brain.  They consist of layers of interconnected
  artificial neurons, each performing a weighted sum followed by a nonlinear
  activation function.  Through backpropagation and gradient descent, these
  networks learn to recognize patterns in data.  Deep neural networks,
  with many hidden layers, have revolutionized computer vision, natural
  language processing, and game-playing AI.
