# Visual Knowledge Library — Industrial Revolution
concept: "Industrial Revolution"
aliases: ["Industrial Age", "steam engine", "factory system", "Industrialisation", "Industrial Revolution 1760"]
documentary_explanation: >
  The Industrial Revolution was the transition from agrarian, handcraft
  economies to machine-manufacturing, factory-based industrialised economies.
  Beginning in Britain around 1760, key innovations included the steam engine
  (Watt), spinning jenny, power loom, iron smelting with coke, and the
  railroad.  It led to unprecedented economic growth, urbanisation, and
  profound social changes — as well as child labour, pollution, and
  exploitation that sparked the labour movement.
