# Visual Knowledge Library — Spacetime Curvature
concept: "Spacetime Curvature"
aliases: ["general relativity", "curved spacetime", "Einstein gravity", "fabric of spacetime", "gravity as geometry", "geodesics"]
documentary_explanation: >
  Spacetime curvature is the central concept of Einstein's general theory of
  relativity (1915), which describes gravity not as a force but as a
  curvature of four-dimensional spacetime caused by mass and energy.  Objects
  move along geodesics (the "straightest possible paths") in curved
  spacetime.  This explains planetary orbits, light bending around massive
  objects (gravitational lensing), time dilation near strong gravity, and
  the expansion of the universe.
