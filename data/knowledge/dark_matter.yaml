# Visual Knowledge Library — Dark Matter
concept: "Dark Matter"
aliases: ["invisible matter", "dark halo", "missing mass", "non-baryonic matter", "dark matter halo"]
documentary_explanation: >
  Dark matter is an unknown form of matter that does not emit, absorb, or
  reflect light, making it invisible to telescopes.  Its existence is inferred
  from gravitational effects: galaxy rotation curves that don't match visible
  mass, gravitational lensing stronger than expected, and the large-scale
  structure of the cosmos.  Dark matter constitutes approximately 85% of all
  matter in the universe.
