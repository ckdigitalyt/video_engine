# Visual Knowledge Library — Evolution
concept: "Evolution"
aliases: ["natural selection", "Darwinian evolution", "descent with modification", "adaptation", "common descent"]
documentary_explanation: >
  Evolution by natural selection, first comprehensively formulated by Charles
  Darwin in On the Origin of Species (1859), is the process by which species
  change over generations through heritable variation and differential
  survival.  It is the central organizing principle of modern biology,
  explaining the diversity and adaptation of all life on Earth from a common
  ancestor approximately 3.5 billion years ago.
