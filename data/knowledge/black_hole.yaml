# Visual Knowledge Library — Black Hole
concept: "Black Hole"
aliases: ["stellar mass black hole", "supermassive black hole", "Sagittarius A*", "singularity", "event horizon"]
documentary_explanation: >
  A black hole is a region of spacetime where gravity is so intense that
  nothing—not even light—can escape.  General relativity predicts that a
  sufficiently compact mass can deform spacetime to form a black hole.
  Stellar-mass black holes form when massive stars collapse.  Supermassive
  black holes, millions to billions of solar masses, sit at the centers of
  most galaxies including our own Milky Way.
