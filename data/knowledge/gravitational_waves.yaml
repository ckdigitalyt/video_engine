# Visual Knowledge Library — Gravitational Waves
concept: "Gravitational Waves"
aliases: ["ripples in spacetime", "LIGO", "gravity waves", "Einstein waves", "spacetime ripples"]
documentary_explanation: >
  Gravitational waves are ripples in spacetime itself, predicted by Albert
  Einstein's general theory of relativity in 1916 and first directly detected
  by LIGO in September 2015.  They are produced by cataclysmic events such as
  merging black holes, neutron star collisions, and supernovae.  Each
  detection opens a new window on the universe—gravitational wave astronomy.
