# Pronunciation lexicon for the Kokoro voice (WP3, DESIGN.md §5.3).
# phonemes: IPA in Kokoro's alphabet, used on the first attempt.
# respell:  plain-text respelling, substituted on the one QA retry (any provider).
#           MUST be lowercase: espeak spells UPPERCASE syllables letter by letter.
# heard_as: how faster-whisper spells a *plausible* pronunciation of a rare
#           word; the QA maps it back so a correct read is not flagged.
# Every phoneme string below was checked by ASR round trip (Kokoro am_michael,
# sentence-initial and mid-sentence). Nobody has LISTENED to them: owner ears
# decide (bench/ab/wp3.md lists which entries rely on an alias).
tyrannosaurus:   {phonemes: "taɪɹˌænəsˈɔːɹəs",  respell: "tie-ran-uh-sawr-us", heard_as: ["tyranosaurus"]}
carnotaurus:     {phonemes: "kˈɑːɹnoʊtˌɔːɹəs",  respell: "kar-no-tawr-us"}
sinosauropteryx: {phonemes: "sˌaɪnəsɔːɹˈɑːptɚɪks", respell: "sigh-nuh-sawr-op-ter-iks"}
ediacaran:       {phonemes: "ˌiːdiˈækəɹən",     respell: "ee-dee-ak-uh-ran"}
chandrasekhar:   {phonemes: "tʃˌʌndɹəsˈeɪkɑːɹ", respell: "chun-druh-say-kar"}
schwarzschild:   {phonemes: "ʃwˈɔːɹtsʃˌɪld",    respell: "shworts-shild"}
liaoning:        {phonemes: "lˌiːˈaʊnɪŋ",       respell: "lee-ow-ning", heard_as: ["leowning"]}
pterodactyl:     {phonemes: "tˌɛɹədˈæktəl",     respell: "terr-uh-dak-til", heard_as: ["terradactyl"]}
chicxulub:       {phonemes: "tʃˈɪkʃulˌuːb",     respell: "chik-shoo-loob", heard_as: ["chickshuleub", "chicks who looped"]}
cenozoic:        {respell: "seenozoic", heard_as: ["senozoic", "seen ozoic", "cinozoic", "sinozoic"]}
cepheid:         {respell: "seffeeid", heard_as: ["sephiid"]}
furcula:         {respell: "furkyula", heard_as: ["fercula", "firkula"]}
theropod:        {respell: "theer-uh-pod", heard_as: ["therapod"]}
betelgeuse:      {respell: "beetel-jooss", heard_as: ["beetlejuice", "beetle juice"]}
olbers:          {respell: "ollberz", heard_as: ["albers"]}
kulik:           {phonemes: "kˈuːlɪk", respell: "koo-lik", heard_as: ["koolik"]}   # WP4: Leonid Kulik (Tunguska); ASR-checked only, not listened to
airburst:        {heard_as: ["air burst"]}   # Q1: ASR writes this compound as two common words even on a correct read
barographs:      {heard_as: ["barrographs"]}   # Q1: faster-whisper's plausible spelling of a correct read (Tunguska)
meltwater:       {heard_as: ["melt water"]}   # Q1: ASR writes this compound as two common words even on a correct read (ice_slippery)
ice:             {heard_as: ["eyes"]}   # decision #13: small.en ASR voiced the final /s/ of a correctly-read "ice" as "eyes" (t_figure_skater_spin B6, confirmed via cached audio + round_trip simulation). NOTE: "ice"/"eyes" is a common-word pair, unlike the rare terms above — if a future script says "eyes" for real, canonical() will mis-map it to "ice" and could mask a genuine miss; revisit if that ever shows up in review.
holocene:        {phonemes: "hˈɑːləsˌiːn", respell: "hol-uh-seen"}   # t_you_re_still_living_in_an_ice_age B8: default phonemization said "hˈɑːloʊsˌiːn" -- the exact phoneme string for "hollow scene", a genuine mispronunciation (not an ASR quirk; Whisper correctly transcribed what was actually spoken). This entry swaps the full "oh" for a schwa in the middle syllable (HOL-uh-seen); ASR-checked only, not listened to by a human yet.
col legno:       {heard_as: ["kyle legno", "coal legno", "cole legno"]}   # t_violinists_hit_strings_with_wood B10: default phonemization of this Italian musical term ("wood on strings") -> ASR heard "Kyle Legno". Tried phoneme overrides first (kˈoʊl lˈɛnjoʊ and variants) but none round-tripped cleanly; heard_as is the same pattern as betelgeuse/cenozoic below. ASR-checked only, not listened to by a human yet.
bussard:         {phonemes: "bˈʌsɑːrd"}   # t_the_starship_that_eats_empty_space B4: Robert Bussard (physicist, interstellar ramjet concept) -- default phonemization read as "Busser". ASR-checked only, not listened to by a human yet.
winds:           {phonemes: "wˈɪndz"}   # 2026-10-17 t_lava_worlds_where_rock_rains B6: the default phonemizer reads the heteronym as the VERB ("wˈaɪndz", to wind up) -> heard "wines" in every retry at every speed. Noun phonemes: ASR round trip now hears "winds". ASR-checked only, not listened to.
supernovae:      {phonemes: "sˌuːpɚnˈoʊviː", heard_as: ["supernovas"]}   # 2026-10-17 t_the_star_almost_missing_its_metals B4/B8/B9/B10: default phonemization drops the plural ("sˈuːpɚnˌoʊvə" = "supernova", 4 held beats). With these phonemes the B4 sentence round-trips PASS (small.en). "supernovas" is the same word's other plural spelling. ASR-checked only.
laetoli:         {phonemes: "lˌɑːeɪtˈoʊli", heard_as: ["lai toli", "laitoli", "liatoli"]}   # 2026-10-17 t_the_rain_that_should_ve_erased_these_footprints B2: default phonemization "lˈiːɾɑːli" = "lee dolly" (a genuine misreading). lah-ay-TOH-lee; faster-whisper spells the correct read "Lai Toli". ASR-checked only.
salar de uyuni:  {phonemes: "səlˈɑːɹ deɪ uːjˈuːni"}   # 2026-10-17 t_this_giant_mirror_used_to_be_a_lake B2: default "aɪˈuːni" (eye-YOO-nee) heard "iyuni"; "de" alone heard "du". Whole-phrase phonemes round-trip PASS (small.en). ASR-checked only.
indohyus:        {phonemes: "ˌɪndoʊhˈaɪəs", heard_as: ["indohayas"]}   # 2026-10-17 live_20261017_181106 t_a_whale_s_fin B4 HELD: default phonemization heard "endoias" at every retry. in-doh-HY-us; faster-whisper spells that read "indohayas". Round trip (base asr_model) PASS for the B4 sentence and sentence-initial; the appositive ", Indohyus," still heard "in dohais" (not aliased: "in" is a common word). ASR-checked only.
daedalus:        {phonemes: "dˈɛdələs", heard_as: ["dedalus"]}   # 2026-10-18 live_20261018_073528 t_fusion_rockets B7 HELD: default phonemization heard "d dell is" (WER 0.18). DED-uh-lus; faster-whisper spells that read "dedalus". Round trip (base asr_model) PASS mid-sentence and sentence-initial. ASR-checked only.
rupes:           {phonemes: "ɹˈuːpiːz", heard_as: ["roopies", "rupees", "roopees"]}   # 2026-10-20 live_20261020_023439 t_this_cliff_takes_13_minutes_to_fall_off B2 HELD: default phonemization read "Verona Rupes" as one syllable ("roops"), a genuine misreading. Latin rupes = ROO-peez. ASR-checked only.
kilometres:      {heard_as: ["km"]}   # 2026-10-20 same story B3 HELD: small.en writes a correctly-read "kilometres" as the abbreviation "km" (base.en heard "kilometers"). ASR spelling quirk, not a misread. ASR-checked only.
bücks:           {heard_as: ["bux"]}   # 2026-10-22 t_sound_can_make_gravity_let_go B4 HELD (WER 0.0435): Kokoro reads "Bücks" bˈuːks (an anglicised "books"), small.en spells that read "Bux". Was compounded by QA deleting the ü ("bcks"); text.ascii_fold now folds it to "bucks". ASR-checked only.
brunhes:         {phonemes: "bɹˈuːn", heard_as: ["broun", "broon", "brune"]}   # 2026-10-22 t_this_rock_still_points_to_earth_s_old_no B3 HELD (WER 0.2): default phonemization "bɹˈʌnhz" (BRUN-hz, a genuine misreading; French Brunhes = "broon"), heard "brunnies". small.en spells the "broon" read "Broun"/"Brune". With matuyama below the B3 sentence round-trips PASS (WER 0.0). ASR-checked only.
matuyama:        {phonemes: "mˌætuːjˈɑːmə", heard_as: ["matayama", "matsuyama"]}   # 2026-10-22 same beat: default "mˌæɾaɪˈɑːmə" (ma-dye-AH-ma, a misreading), heard "madayama". ma-too-YAH-ma; small.en writes "Matuyama" mid-sentence, "Matayama"/"Matsuyama" in other contexts. ASR-checked only.
jwst's:          {heard_as: ["jwst", "jwsd"]}   # 2026-10-22 live_20261022_192113 t_this_star_system_blazes_every_eight_year B7 HELD (WER 0.0556): Kokoro reads "JWST's" letter by letter with the possessive, but small.en drops the 's ("jwst") or writes "jwsd". Keyed on the possessive so the script side folds plain "JWST" to the same token (canonical_ref) and both forms compare equal. B7 sentence + 3 probes round-trip PASS (WER 0.0). ASR spelling quirk, not a misread. ASR-checked only.
