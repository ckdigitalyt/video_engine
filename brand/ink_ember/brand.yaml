# Ink & Ember (DESIGN.md §7.1 example / §17 option A) — the single source of
# visual/audio truth for @most.amazing.wonders. Loaded + validated by
# engine.brand.load_brand(); every colour a template/spec uses must be a
# ROLE NAME from `roles`, resolved to a palette hex only at render/compositing
# time (engine.brand.resolve / role_hex), never baked in earlier.
brand_id: ink_ember
version: 1
channel_name: "Most Amazing"

palette:
  paper: "#EDE0C4"
  ink: "#15202B"
  navy: "#1F3A56"
  accent: "#C4502A"
  gold: "#E3A83B"
  white: "#FFF7E8"

roles:
  caption_fill: white
  caption_stroke: ink
  caption_active: gold
  caption_key: accent
  headline: white
  headline_2: accent
  label: gold
  scrim: ink

fonts:
  headline:
    file: BebasNeue-Regular.ttf
    license_file: OFL_bebasneue.txt
    license: OFL-1.1
  caption:
    file: ArchivoBlack-Regular.ttf
    license_file: OFL_archivoblack.txt
    license: OFL-1.1
  eyebrow:
    file: "Fraunces-Italic[SOFT,WONK,opsz,wght].ttf"
    instance: "Bold Italic"
    license_file: OFL_fraunces.txt
    license: OFL-1.1

# Params match research/phase3/brand_frames.py OPTIONS["A_ink_ember"]["lut"]
# (Phase 2 brand_v0 grade: gentle S-curve, slight desaturation, navy-leaning
# shadows / warm highlights). grade.cube is generated by engine.brand.
# generate_cube with these exact params — deterministic, so the sha256 below
# is reproducible from params alone (bench/ab/wp6.md "LUT-hash test").
grade:
  cube: grade.cube
  sha256: 370dc7b10f022725258199f2c94215bdddaad7e403f8580b8660c7941e42bf62
  generator: "engine.brand:generate_cube"
  params: {s: 0.12, sat: 0.92, sh: [-0.02, 0.0, 0.035], hi: [0.03, 0.012, -0.03],
           lift: 0.0, gamma: 1.0}

plate_style:
  prompt_prefix: "vintage 1950s scientific illustration, ink and sepia wash on
    aged parchment, engraving linework"
  variants:
    ink_day: "vintage 1950s scientific illustration, ink and sepia wash on
      aged parchment, engraving linework, daylight"
    ink_night: "vintage 1950s scientific illustration, deep indigo ink wash
      on aged parchment, engraving linework, night lighting, warm amber
      point-light accents"
  banned_terms: [diagram, grammar, chart, infographic, typography, label,
                 poster, page, book, annotation, caption, text, letter,
                 watermark, logo, signature]

captions:
  size_px: 100
  min_px: 84
  max_words: 4
  max_lines: 2
  center_y: 1180
  max_width: 780
  active: underline_gold
  keyword: scale_1.18_accent
  anim: spring_pop_120ms

safe_zones:
  top: 220
  bottom: 1440
  right_rail: {x: 930, y0: 760}   # [U: exact YouTube insets vary]

sting:
  audio: sting.wav
  visual: ink_bloom
  dur_s: 0.4
  overlay: true

outro:
  visual: seal_stamp
  badge: series_part
  dur_s: 1.5
  loop_bridge: true

cover:
  template: title_lower_third
  title_font: headline
  badge: series_part
  logo: seal

mascot: null
