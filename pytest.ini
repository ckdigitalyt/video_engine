[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
markers =
    integration: marks tests that use real filesystem or databases (not pure unit)
    slow: marks tests that may take longer (deselect with -m 'not slow')
log_cli = false
log_level = INFO
